services:
  postgres:
    image: postgres:16-alpine
    container_name: ro_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ro_dev
      POSTGRES_USER: ro_user
      POSTGRES_PASSWORD: ro_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ro_user -d ro_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
