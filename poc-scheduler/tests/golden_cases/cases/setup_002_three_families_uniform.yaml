    - job_id: 1
      operations:
        - {job_id: 1, sequence_idx: 0, machine_id: 0, duration: 2, family_id: 1}
    - job_id: 2
      operations:
        - {job_id: 2, sequence_idx: 0, machine_id: 0, duration: 2, family_id: 2}
  machines:
    - {machine_id: 0}
  transition_matrix:
    - [0, 4, 4]
    - [4, 0, 4]
    - [4, 4, 0]
expected:
