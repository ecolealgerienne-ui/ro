          machine_id: 0
          duration: 5
          qualified_operator_ids: [0, 1]
    - job_id: 1
      operations:
        - job_id: 1
          sequence_idx: 0
          machine_id: 1
          duration: 5
          qualified_operator_ids: [0, 1]
    - job_id: 2
      operations:
        - job_id: 2
          sequence_idx: 0
          machine_id: 2
          duration: 5
          qualified_operator_ids: [0, 1]
  machines:
    - {machine_id: 0}
    - {machine_id: 1}
    - {machine_id: 2}
