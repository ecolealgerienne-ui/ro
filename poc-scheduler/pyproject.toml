[project]
name = "poc-scheduler"
version = "0.1.0"
description = "POC OR-Tools CP-SAT — moteur d'ordonnancement pour ateliers de mécanique de précision"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "ro project" }]

dependencies = [
    "ortools>=9.10",
    "pydantic>=2.0",
    "click>=8.1",
    "rich>=13.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "anthropic>=0.39",
    # Phase 4 J4 : worker DB-as-queue (psycopg v3, driver Postgres)
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.7",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------- Ruff (lint + format) ----------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # ligne trop longue : géré par le formatter
    # Typographie française tolérée dans les docstrings/commentaires :
    "RUF001", # ambiguous string char (× dans "5×5", – dans listes)
    "RUF002", # ambiguous docstring char (idem)
    "RUF003", # ambiguous comment char (idem)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "N802"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------- MyPy (type checking strict) ----------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = ["data/", "build/", "dist/"]

[[tool.mypy.overrides]]
module = ["ortools.*"]
ignore_missing_imports = true

# ---------- Pytest ----------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "slow: tests longs (deselect avec -m 'not slow')",
    "integration: tests d'intégration",
    "golden: tests sur cas-tests de référence",
]

# ---------- Coverage (activé quand on aura du code applicatif) ----------
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
